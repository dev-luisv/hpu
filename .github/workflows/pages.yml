name: Deploy HPU to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore fixed HPU images
        run: |
          mkdir -p client/public/assets/hpu-fixed
          cat .github/assets/hpu-fixed/part-*.b64 | base64 --decode > /tmp/hpu-fixed.zip
          echo "200fb65be098cca8efa90ea4868487e2e3a6201cea23eb641af7f32ebd7918a8  /tmp/hpu-fixed.zip" | sha256sum -c -
          unzip -o /tmp/hpu-fixed.zip -d client/public/assets/hpu-fixed

      - name: Build static site
        run: pnpm run build:static

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
